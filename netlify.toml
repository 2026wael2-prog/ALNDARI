
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com data:; img-src 'self' data: blob: https://*.supabase.co https://*.googleusercontent.com; media-src 'self' data: blob: https://cdn.islamic.network https://*.islamic.network https://*.archive.org https://archive.org https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.islamic.network https://*.islamic.network https://*.archive.org https://archive.org https://api.deepseek.com https://openrouter.ai https://*.openrouter.ai https://vpic.nhtsa.dot.gov https://nominatim.openstreetmap.org https://accounts.google.com https://www.googleapis.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Cross-Origin-Opener-Policy = "same-origin"
