<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" role="img" aria-label="شعار شركة النظاري">
  <defs>
    <path id="alnadaryArc" d="M 38 148 A 84 84 0 0 1 174 38" fill="none" />
    <linearGradient id="crimsonRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Curved Crimson Banner (Al-Nadary) -->
  <path
    d="M 22 152 A 96 96 0 0 1 184 26 L 169 52 A 69 69 0 0 0 50 146 Z"
    fill="url(#crimsonRibbon)"
    stroke="#7f1d1d"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <text
    fill="#ffffff"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="21"
    font-weight="900"
    letter-spacing="2.2"
  >
    <textPath href="#alnadaryArc" startOffset="50%" text-anchor="middle">
      Al-Nadary
    </textPath>
  </text>

  <!-- Stylized Crisp Black Eagle Head Emblem -->
  <g fill="#0a0a0a" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crown & head silhouette -->
    <path d="M 86 132 C 74 114 73 84 90 66 C 103 53 128 49 147 57 C 159 62 167 71 170 81 C 179 84 186 92 184 103 C 182 110 176 115 171 116 C 173 107 168 100 158 98 C 151 97 146 100 144 105 C 152 108 158 117 159 131 L 146 124 L 138 134 L 128 122 L 118 134 L 108 123 L 96 134 Z" />
    <!-- White eye & brow cutout for crisp eagle expression -->
    <path d="M 103 76 C 118 70 137 72 150 81 C 138 82 124 85 113 84 Z" fill="#ffffff" stroke="none" />
    <circle cx="136" cy="79" r="3.4" fill="#0a0a0a" stroke="none" />
    <!-- Neck feather accents -->
    <path d="M 92 92 C 102 88 112 90 120 96 C 109 98 99 98 91 96 Z" fill="#ffffff" stroke="none" />
    <path d="M 90 106 C 101 103 112 105 121 111 C 110 112 99 112 90 110 Z" fill="#ffffff" stroke="none" />
    <!-- Beak highlight -->
    <path d="M 162 86 C 171 88 176 94 176 102 C 171 97 166 94 159 93 Z" fill="#ffffff" stroke="none" />
  </g>

  <!-- Bold Arabic Brand Signature -->
  <text
    x="124"
    y="176"
    text-anchor="middle"
    fill="#0a0a0a"
    font-family="'Cairo', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif"
    font-size="34"
    font-weight="900"
  >
    النظاري
  </text>
  <line x1="68" y1="186" x2="180" y2="186" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" />
</svg>
